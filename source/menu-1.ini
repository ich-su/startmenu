# Файлы menu-0.ini .. menu-9.ini загружаются из рабочей папки (не из папки с исполняемым файлом)


# [#Settings]
# Width = 1 (или -1) - стандартная ширина; 2 - двойная, 0.5 - половина и т.п.
# PaddingLeft = -1 - стандартный отступ; иначе - в процентах (0..1) от ширины окна
# SmallIcons = 1 - маленькие иконки; иначе - большие

# [Имя 1]
# File = Путь\команда (исполняемый файл)
# Parameters = Параметры запуска
# Directory = Рабочая папка
# Hotkey = Горячая клавиша (правильное обозначение можно получить через пункт меню "Обозначение горячих клавиш")
# Icon = Путь\файл, если нужна другая иконка; возможно указание .ico-файла, .png-файла или .exe-файла; если нужен пункт меню без иконки, необходимо присвоить Icon = none
# Separator = Размер отступа от предыдущего пункта меню: 1 - стандартный отступ, 2 - двойной, 0.25 - четверть…; Separator = down - прижамает пункт меню и все последующие к низу окна
# PopupMenu = Путь\файл.ini, если нужно свое всплывающее меню; также доступны PopupMenu-0 .. PopupMenu-9; PopupMenu = none - отключает PopupMenu
#
# [Имя 2]
# …

[#Settings]
Width = -1
PaddingLeft = -1
SmallIcons = -1


[CentBrowser]
File = \programs\CentBrowser\chrome.exe
PopupMenu = popupmenu\folder downloads.ini
Hotkey = C

[ich proxy]
File = \ich\proxy\proxy_plink_tree.cmd
Icon = \ich\ico\cat_i_64.ico

[CentBrowser (proxy)]
File = \programs\CentBrowser2\chrome.exe
