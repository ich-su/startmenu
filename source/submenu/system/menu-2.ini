[#Settings]
Replace = 1


[Командная строка]
File = %SystemRoot%\system32\cmd.exe
HotKey = Ctrl+C

[Windows PowerShell]
File = %SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe

[Проводник]
File = %SystemRoot%\explorer.exe
HotKey = Ctrl+E

[Выполнить…]
File = %UserProfile%\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\System Tools\Run.lnk
HotKey = Meta+R

[Диспетчер задач]
Separator = 1
File = %SystemRoot%\System32\Taskmgr.exe
HotKey = Ctrl+T

[Монитор ресурсов]
File = %SystemRoot%\system32\perfmon.exe
Parameters = /res

[Панель управления]
Separator = 1
File = %SystemRoot%\System32\control.exe
HotKey = Ctrl+P

[Управление компьютером]
File = %SystemRoot%\system32\compmgmt.msc
Parameters = /s
HotKey = Ctrl+U

[Редактор реестра]
File = %SystemRoot%\regedit.exe
HotKey = Ctrl+R

[Групповые политики]
File = %SystemRoot%\System32\gpedit.msc 

[Управление печатью]
File = %SystemRoot%\system32\printmanagement.msc

[Параметры дисплея]
File = %SystemRoot%\System32\DpiScaling.exe

#[Сетевые подключения]
#File = %SystemRoot%\explorer.exe
#Parameters = shell:ConnectionsFolder
