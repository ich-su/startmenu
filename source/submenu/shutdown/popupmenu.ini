[#Settings]
Replace = 1


[Завершение работы]
File = %SystemRoot%\System32\shutdown.exe
Parameters = /s /t 0

[Гибернация]
File = %SystemRoot%\System32\shutdown.exe
Parameters = /h

[Перезагрузка]
Separator = 1
File = %SystemRoot%\System32\shutdown.exe
Parameters = /r /t 0

[Окно завершения работы Windows]
Separator = 1
File = submenu\shutdown\shutdown.vbs
