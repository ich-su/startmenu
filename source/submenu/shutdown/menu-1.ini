[Блокировка экрана]
Separator = down
File = %SystemRoot%\System32\rundll32.exe
Parameters = user32.dll, LockWorkStation
#Icon = icon\lock.png
Icon = icon\lock.ico
PopupMenu = none

[Завершение сеанса]
File = %SystemRoot%\System32\shutdown.exe
Parameters = /l
#Icon = icon\exit.png
Icon = icon\exit.ico
PopupMenu = none

[Перезагрузка]
Separator = 0.75
File = %SystemRoot%\System32\shutdown.exe
Parameters = /r /t 0
#Icon = icon\restart.png
Icon = icon\restart.ico
PopupMenu = none

[Перезагрузка с меню]
File = %SystemRoot%\System32\shutdown.exe
Parameters = /r /o /t 0
PopupMenu = none

[В BIOS после перезагрузки]
File = %SystemRoot%\System32\shutdown.exe
Parameters = /r /fw /t 1
PopupMenu = none

[Сон]
Separator = 0.75
File = psshutdown.exe
Parameters = -d -t 0
#Icon = icon\sleep.png
Icon = icon\sleep.ico
PopupMenu = none

[Гибернация]
File = %SystemRoot%\System32\shutdown.exe
Parameters = /h
#Icon = icon\hibernation.png
Icon = icon\hibernation.ico
PopupMenu = none

[Завершение работы]
File = %SystemRoot%\System32\shutdown.exe
Parameters = /s /t 0
#Icon = icon\shutdown.png
Icon = icon\shutdown.ico
PopupMenu = none
