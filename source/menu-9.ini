[Система]
File = %self%
Directory = submenu\system
Parameters = /cheat
#Icon = submenu\system\windows.png
Icon = submenu\system\windows.ico
HotKey = F2
PopupMenu = submenu\system\menu-2.ini
PopupMenu-2 = submenu\system\menu-3.ini
