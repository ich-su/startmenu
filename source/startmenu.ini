# сначала грузиться startmenu.ini из папки исполняемого startmenu.exe, затем еще один из 
# рабочей папки - для возможности изменения отдельных настроек


[Explorer]
Path = %SystemRoot%\explorer.exe

[TotalCommander]
#Path = %ProgramFiles(x86)%\Total Commander\TOTALCMD64.EXE
Path = \programs\Total Commander\TOTALCMD64.EXE
Parameters = /O /P=L /L="%s"


# проект написан на Lazarus, поэтому цветовые константы должны быть описаны в формате
# Lazarus/Delphi. Посмотреть подробнее, например, можно тут: wiki.freepascal.org/Colors/ru
[ColorsClassic]
ColorBack = clBtnFace
ColorFont = clBtnText
ColorCurrentBack = clHighlight
ColorCurrentFont = clHighlightText
ColorActiveBack = clHotLight
ColorActiveFont = clHighlightText

#Windows 10/11 темная тема
[ColorsDark]
ColorBack = $1F1F1F
ColorFont = clWindow
ColorCurrentBack = $353535
ColorCurrentFont = clWindow
ColorActiveBack = $4C4C4C
ColorActiveFont = clWindow

#Windows 10/11 светлая тема
[ColorsLight]
ColorBack = $E4E4E4
ColorFont = $161616
ColorCurrentBack = $EFEFEF
ColorCurrentFont = $161616
ColorActiveBack = $EFEFEF
ColorActiveFont = $161616


[Form]
# значения задаются в процентах (0..1) от размеров рабочего стола, 
# если значение = -1, то оно считается стандартным
Width = 0.85
Height = 0.9
Left = 0
Top = 0
# прозрачность: 0..1
AlphaBlend = -1

# пример: слева-внизу
# Width = 0.7
# Height = 0.75
# Left = 0
# Top = 0.25
 
# пример: справа-внизу
# Width = 0.7
# Height = 0.75
# Left = 0.3
# Top = 0.25

# пример: слева-вверху
# Width = 0.7
# Height = 0.75
# Left = 0
# Top = 0

# пример: по центру-внизу
# Width = 0.7
# Height = 0.75
# Left = -1
# Top = 0.25


[Paddings]
#отступы от границ окна, задаются в процентах (0..1) от размера окна; -1 - стандартные
Left = -1
Right = -1
Top = 0.02
Bottom = -1
#отступ между колонками (может быть изменен в каждом файле меню параметром PaddingLeft)
In = -1

# пример: без рамок
# Left = 0
# Right = 0
# Top = 0
# Bottom = 0
# In = -1

# пример: рамки побольше
# Left = 0.075
# Right = 0.075
# Top = 0.075
# Bottom = 0.075
# In = 0.025


[Settings]
# 1 - увеличивает высоту пунктов всплывающих меню (полезно для планшетов с сенсорным экраном)
HighMenuItems = 1
# 1 - активное приложение не отображается на панели задач
HideIconInTaskBar = 1
# 1 - скруглять углы у активного пункта меню; -1 - по умолчанию: у Windows 11 сгрулять, у других - нет
RoundCorners = -1
# добавить пикселей слева и справа в отсупы пункта меню
AddPixelsH = 0
# добавить пикселей сверху и снизу в отсупы пункта меню
AddPixelsV = 0
# добавить пикселей в разделитель
AddPixelsSeparator = 0
